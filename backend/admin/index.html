<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影像 · 管理</title>
<style>
  /*
   * 配色照抄影像页那张纸：底色 --paper、墨色 --ink、强调 --accent。
   * 这是个本机工具，但用同一套色，看久了不会觉得是两个世界的东西。
   */
  :root {
    --paper: #f6f9f7;
    --surface: #f9fcfa;
    --ink: #2e3130;
    --ink-soft: #646a67;
    --ink-faint: #919e98;
    --line: #d0d8d3;
    --line-soft: #dee5e1;
    --accent: #5a796f;
    --danger: #a33b30;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

  h1 { margin: 0; font-size: 1.15rem; font-weight: 500; letter-spacing: .04em; }
  h2 { margin: 0 0 .2rem; font-size: .95rem; font-weight: 500; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
  .head__sub { font-size: .78rem; color: var(--ink-faint); letter-spacing: .04em; }

  .stats { display: flex; gap: 1.5rem; margin-top: 1.25rem; font-size: .78rem; color: var(--ink-soft); }
  .stats b { font-weight: 500; color: var(--ink); }
  .stats .warn b { color: var(--danger); }

  .dir {
    margin-top: 1rem; padding: .7rem .9rem;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px;
    font: 12px/1.7 ui-monospace, Consolas, monospace;
    color: var(--ink-soft); word-break: break-all;
  }

  .note {
    margin-top: .85rem; padding-left: .9rem; border-left: 2px solid var(--line);
    font-size: .78rem; line-height: 1.8; color: var(--ink-soft);
  }
  .note b { font-weight: 500; color: var(--ink); }

  /* ---------- 投放区 ---------- */

  .drop {
    margin-top: 1.75rem; padding: 2.25rem 1.5rem;
    border: 1.5px dashed var(--line); border-radius: 12px;
    background: var(--surface);
    text-align: center; cursor: pointer;
    transition: border-color 160ms, background 160ms;
  }
  .drop:hover, .drop.is-over { border-color: var(--accent); background: #f2f8f5; }
  .drop__main { font-size: .95rem; }
  .drop__sub { margin-top: .45rem; font-size: .76rem; color: var(--ink-faint); }
  input[type=file] { display: none; }

  /* ---------- 照片网格 ---------- */

  .section { margin-top: 2.75rem; }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .35rem; }
  .section__count { font-size: .76rem; color: var(--ink-faint); }

  .grid { list-style: none; display: grid; gap: 1.25rem; padding: 0; margin: 1.25rem 0 0;
          grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }

  .tile {
    position: relative; padding: .55rem .55rem .6rem;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px;
  }
  .tile:hover { box-shadow: 0 1px 0 var(--line); }

  .tile__frame { position: relative; aspect-ratio: 1/1; background: #fff;
                 border: 1px solid var(--line-soft); overflow: hidden; border-radius: 4px; }
  .tile__frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .tile__no {
    position: absolute; left: 0; top: 0; padding: .1rem .35rem;
    background: rgba(246,249,247,.92); border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
    font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--ink);
  }

  .tile__row { display: flex; align-items: center; justify-content: space-between; gap: .4rem; margin-top: .5rem; }
  .tile__name { font-size: .7rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile__size { font-size: .68rem; color: var(--ink-faint); flex: none; }

  /* 只剩删除一个动作：不撑满整行，贴右，别让红色悬停铺得太响 */
  .tile__acts { display: flex; justify-content: flex-end; margin-top: .5rem; }
  .tile__acts button {
    padding: .25rem .6rem; border: 1px solid var(--line-soft); border-radius: 5px;
    background: transparent; color: var(--ink-soft); font-size: .72rem; cursor: pointer;
    transition: border-color 140ms, color 140ms;
  }
  .tile__acts button:hover { border-color: var(--danger); color: var(--danger); }

  .empty { margin-top: 1.5rem; font-size: .82rem; color: var(--ink-faint); }

  /* ---------- 留言 ---------- */

  /*
   * 留言。**和照片那套格子不是一回事**：一条一行、只有一条淡痕分隔，
   * 不留缩略图 —— 留言是要读的字，不是要摆的格子。
   *
   * 曾经上面还有一排「每个项目各几条」的标签（.byproj），随留言不再按项目分
   * 一起删了：现在只有一池，一行数字没地方摆。
   */
  .cmts { list-style: none; margin: 1.25rem 0 0; padding: 0; }
  .cmt { padding: .9rem 0; border-top: 1px solid var(--line-soft); }
  .cmt:first-child { border-top: 0; padding-top: 0; }
  .cmt__top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .cmt__meta { font-size: .74rem; color: var(--ink-faint); word-break: break-all; }
  .cmt__meta b { font-weight: 500; color: var(--ink); }
  .cmt__body {
    margin: .35rem 0 0; font-size: .85rem; line-height: 1.8; color: var(--ink);
    /* 留言是文本框里敲出来的，换行要留着 */
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .cmt__del {
    flex: none; padding: .15rem .6rem;
    border: 1px solid var(--line-soft); border-radius: 5px; background: transparent;
    color: var(--ink-soft); font-size: .72rem; cursor: pointer;
    transition: border-color 140ms, color 140ms;
  }
  .cmt__del:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .cmt__del:disabled { opacity: .35; cursor: default; }

  /* ---------- 提示条 ---------- */

  .toast {
    position: fixed; left: 50%; bottom: 2rem; transform: translate(-50%, 1rem);
    padding: .55rem 1.1rem; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: .8rem;
    opacity: 0; pointer-events: none; transition: opacity 200ms, transform 200ms;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  .toast.is-bad { background: var(--danger); }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>影像 · 管理</h1>
      <p class="head__sub">往影像页的照片墙里加图。选完即上传，方图由后端兜底裁。</p>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="dir" id="dirBox">加载中…</div>

  <p class="note">
    照片存在后端目录（<b>运行时</b>读取，不是打进构建产物），影像页刷新就能看到。
    顺序就是文件名里的编号、也就是上传的先后，<b>不可调</b> —— 没有第二份清单。
  </p>

  <div class="drop" id="drop">
    <p class="drop__main">把照片拖进来，或者点这里选</p>
    <p class="drop__sub">JPG / PNG / WebP · 选完直接上传，后端居中裁成正方形</p>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <section class="section">
    <div class="section__head">
      <h2>照片墙</h2>
      <span class="section__count" id="count"></span>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>还没有照片。上面拖一张进来。</p>
  </section>

  <section class="section">
    <div class="section__head">
      <h2>留言</h2>
      <span class="section__count" id="cmtCount"></span>
    </div>
    <p class="head__sub">留言页的留言直接上墙，不审核 —— 不合适的在这里删掉。</p>
    <ul class="cmts" id="cmts"></ul>
    <p class="empty" id="cmtEmpty" hidden>还没有留言。</p>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ *
 * 状态
 * ------------------------------------------------------------------ */

const state = {
  photos: [],
  meta: {},
};

const $ = (id) => document.getElementById(id);
const grid = $('grid');

/* ------------------------------------------------------------------ *
 * 工具
 * ------------------------------------------------------------------ */

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.status + ' ' + res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function human(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function ordinal(n) { return String(n).padStart(2, '0'); }

function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let toastTimer;
function toast(message, bad) {
  const el = $('toast');
  el.textContent = message;
  el.classList.toggle('is-bad', !!bad);
  el.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-on'), 2600);
}

/* ------------------------------------------------------------------ *
 * 列表
 * ------------------------------------------------------------------ */

async function load() {
  const data = await api('/api/photos');
  state.meta = data;
  state.photos = data.photos;
  render();
}

function render() {
  const { count, total_bytes: total, max_side: maxSide, quality } = state.meta;
  const heavy = total > 8 * 1024 * 1024;

  $('stats').innerHTML =
    '<span><b>' + count + '</b> 张</span>' +
    '<span class="' + (heavy ? 'warn' : '') + '">合计 <b>' + human(total) + '</b></span>' +
    '<span>输出 <b>' + maxSide + ' × ' + maxSide + '</b> · 质量 ' + quality + '</span>' +
    (heavy ? '<span class="warn">建议压一压：格子只有约 280px 见方</span>' : '');

  $('dirBox').textContent = state.meta.dir;
  $('count').textContent = count ? '共 ' + count + ' 张，按这个顺序显示' : '';
  $('empty').hidden = count > 0;

  grid.innerHTML = state.photos.map((photo, i) => `
    <li class="tile" data-index="${i}">
      <div class="tile__frame">
        <img src="${esc(photo.url)}" alt="" loading="lazy">
        <span class="tile__no">${ordinal(photo.index)}</span>
      </div>
      <div class="tile__row">
        <span class="tile__name" title="${esc(photo.name)}">${esc(photo.name)}</span>
        <span class="tile__size">${human(photo.bytes)}</span>
      </div>
      <div class="tile__acts">
        <button data-act="del" data-index="${i}" title="删除">删除</button>
      </div>
    </li>`).join('');
}

grid.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  const index = Number(button.dataset.index);
  const photo = state.photos[index];
  if (!confirm('删掉 ' + photo.name + '？文件会直接从目录里移除。')) return;
  try {
    const data = await api('/api/photos/' + encodeURIComponent(photo.name), { method: 'DELETE' });
    state.meta = data;
    state.photos = data.photos;
    render();
    toast('已删除');
  } catch (err) {
    toast('删除失败：' + err.message, true);
  }
});

/* ------------------------------------------------------------------ *
 * 选文件 → 直接上传
 *
 * 不做前端裁剪了：**图是不是方的，由后端 _to_rgb_square() 兜底**
 * （它会先按 EXIF 摆正、再居中裁成方图、缩到 MAX_SIDE）。
 * 这里只做两件事：把原文件塞进 FormData，POST 出去。
 *
 * 代价是上传的是原图字节，比「前端先裁再传」费流量（手机原图十几 MB）。
 * 换来的是这条链路短了一截，而且**方图这件事只在一处定义**，
 * 前端不用再复刻一遍坐标系换算 —— 那种两处对齐的代码迟早会对不上。
 * ------------------------------------------------------------------ */

$('drop').addEventListener('click', () => $('fileInput').click());

$('drop').addEventListener('dragover', (event) => {
  event.preventDefault();
  $('drop').classList.add('is-over');
});
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('is-over'));
$('drop').addEventListener('drop', (event) => {
  event.preventDefault();
  $('drop').classList.remove('is-over');
  handleFiles(event.dataTransfer.files);
});

$('fileInput').addEventListener('change', (event) => {
  handleFiles(event.target.files);
  event.target.value = '';
});

/** 一张一张来。并发上传只会让「第几张成功了」说不清。 */
const queue = [];
let busy = false;

function handleFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) { toast('跳过非图片：' + file.name, true); continue; }
    queue.push(file);
  }
  if (!busy) nextInQueue();
}

async function nextInQueue() {
  if (!queue.length) { busy = false; return; }
  busy = true;
  const file = queue.shift();
  try {
    await upload(file);
  } catch (err) {
    toast(file.name + '：' + err.message, true);
  } finally {
    nextInQueue();
  }
}

/**
 * 上传一张原图。成功返回的**是整个清单**（后端 /api/photos 就是这么回的），
 * 所以这里直接拿它重画网格，不用自己往 state.photos 里塞。
 *
 * 文件名由后端定：存的是一串自增编号，`1.jpg`、`2.jpg`……
 * 原名不参与命名（照片墙上认的是图，不是文件名）。
 */
async function upload(file) {
  const form = new FormData();
  form.append('file', file, file.name);
  const data = await api('/api/photos', { method: 'POST', body: form });
  state.meta = data;
  state.photos = data.photos;
  render();
  toast('已加入照片墙');
}

/* ------------------------------------------------------------------ *
 * 留言（留言页那个留言区。照片与留言是两件事，各读各的接口）
 * ------------------------------------------------------------------ */

async function loadComments() {
  try {
    renderComments(await api('/api/comments'));
  } catch (err) {
    $('cmtCount').textContent = '';
    $('cmtEmpty').textContent = '读不到留言：' + err.message;
    $('cmtEmpty').hidden = false;
  }
}

function renderComments(data) {
  /*
   * 接口给的是**从旧到新**（留言页要的读序）；这一页从新到旧，
   * 最近的多半才是要处理的那条 —— 所以在这里倒一下。
   * 顺序只有一个出口（后端那条 ORDER BY），这里只是换个方向看。
   */
  const items = (data.items || []).slice().reverse();

  $('cmtCount').textContent = items.length ? items.length + ' 条' : '';
  $('cmtEmpty').hidden = items.length > 0;

  $('cmts').innerHTML = items.map((c) =>
    '<li class="cmt">' +
      '<div class="cmt__top">' +
        '<span class="cmt__meta"><b>' + esc(c.name) + '</b> · ' +
          esc(stamp(c.createdAt)) + '</span>' +
        '<button class="cmt__del" data-id="' + c.id + '">删除</button>' +
      '</div>' +
      '<p class="cmt__body">' + esc(c.body) + '</p>' +
    '</li>'
  ).join('');
}

/** ISO（后端存的是 UTC）→ 本地的 2026-09-19 15:13 */
function stamp(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
         ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

$('cmts').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-id]');
  if (!button) return;
  if (!confirm('删掉这条留言？删了就找不回来了。')) return;

  button.disabled = true;
  try {
    await api('/api/comments/' + button.dataset.id, { method: 'DELETE' });
    toast('已删除');
    loadComments();
  } catch (err) {
    button.disabled = false;
    toast('删除失败：' + err.message, true);
  }
});

/* ------------------------------------------------------------------ */

load().catch((err) => {
  $('dirBox').textContent = '读不到照片列表：' + err.message;
  toast('读不到照片列表：' + err.message, true);
});

loadComments();
</script>
</body>
</html>
