<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      站点图标。全在 public/ 下，由 npm run build-icons 从 scripts/icon-source.png 生成
      （源图是 512 的位图，没有矢量可依，所以没有 .svg 那一份）。
      ico 里打包了 16 / 32 / 48 三帧，`sizes="any"` 让浏览器自己挑最合适的那帧；
      192 给高分屏与「添加到主屏」；180 那枚在生成时就垫了纸色底（iOS 不给透明图配底）。
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIzao 的自留地</title>
    <meta
      name="description"
      content="李泽敖的个人网站：写的东西、拍的照片，以及湖边那间小屋。"
    />
    <meta name="theme-color" content="#f6f9f7" />

    <!--
      社交卡片。用湖景合成图裁的 1200×630，由 npm run build-scenes 生成。
      首屏本身就是一张画，这是这个站能给出的最好的 og:image。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LIzao 的自留地" />
    <meta
      property="og:description"
      content="李泽敖的个人网站：写的东西、拍的照片，以及湖边那间小屋。"
    />
    <meta property="og:image" content="/og-cover.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      在 CSS 加载之前先把底色定下来，否则会闪一下纯白。
      色值必须和 main.css 里的 --paper 一致（全站唯一的页面底色，
      也就是湖边那幅景的纸色）。
      只有一套光明配色，不需要脚本判断明暗。
    -->
    <style>
      html {
        background-color: #f6f9f7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
