<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LI枣的自留地</title>
    <meta
      name="description"
      content="李泽敖的个人网站：杭州师范大学数学硕士研究生，研究方向为工业时序大模型、工业软测量与 AI Agent 应用。"
    />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1d19" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LI枣的自留地" />
    <meta
      property="og:description"
      content="杭州师范大学数学硕士研究生，研究方向为工业时序大模型、工业软测量与 AI Agent 应用。"
    />

    <!--
      在 CSS 加载之前先把底色定下来，否则深色模式下会闪一下白。
      逻辑必须和 src/composables/useTheme.ts 保持一致，
      色值必须和 main.css 里的 --paper 一致。
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var stored = localStorage.getItem('lizao-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.toggle('dark', dark)
          root.style.backgroundColor = dark ? '#1f1d19' : '#f6f3ec'
        } catch (e) {
          root.style.backgroundColor = '#f6f3ec'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
